name: CI - Test Suite

on:
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend-rest/package-lock.json'

      - name: Install backend dependencies
        working-directory: backend-rest
        run: npm ci

      - name: Run ESLint
        working-directory: backend-rest
        run: npm run lint

      - name: Check code formatting with Prettier
        working-directory: backend-rest
        run: npm run format:check

      - name: Check npm audit for critical vulnerabilities
        working-directory: backend-rest
        run: npm audit --audit-level=critical

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend-rest/package-lock.json'

      - name: Install backend dependencies
        working-directory: backend-rest
        run: npm ci

      - name: Run backend tests
        working-directory: backend-rest
        run: npm test

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run ESLint
        working-directory: frontend-react
        run: npm run lint

      - name: Check code formatting with Prettier
        working-directory: frontend-react
        run: npm run format:check

      - name: Run npm audit
        working-directory: frontend-react
        run: npm audit --audit-level=moderate

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Build frontend
        working-directory: frontend-react
        run: npm run build

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend-react
        run: npm test -- --run

  e2e-cypress:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend-rest/package-lock.json
            frontend-react/package-lock.json

      - name: Install backend dependencies
        working-directory: backend-rest
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Create backend .env file
        working-directory: backend-rest
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=3000
          MONGODB_CONNECT_STRING=mongodb://localhost:27017/exercise-tracker-test
          JWT_SECRET=test-secret-key-for-ci
          EOF

      - name: Start backend server
        working-directory: backend-rest
        run: npm start > backend.log 2>&1 &
        env:
          NODE_ENV: test

      - name: Start frontend dev server
        working-directory: frontend-react
        run: npm run dev > frontend.log 2>&1 &

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          cat backend-rest/backend.log
          exit 1

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          cat frontend-react/frontend.log
          exit 1

      - name: Run Cypress E2E tests
        working-directory: frontend-react
        run: npm run cypress:run

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend-react/cypress/videos

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend-react/cypress/screenshots

      - name: Collect backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend-rest/backend.log

  all-checks-passed:
    name: All Checks Passed
    needs: [backend-lint, backend-tests, frontend-lint, frontend-build, frontend-tests, e2e-cypress]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all results
        run: |
          failed=0

          if [ "${{ needs.backend-lint.result }}" != "success" ]; then
            echo "❌ Backend linting failed"
            failed=1
          fi

          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "❌ Backend tests failed"
            failed=1
          fi

          if [ "${{ needs.frontend-lint.result }}" != "success" ]; then
            echo "❌ Frontend linting failed"
            failed=1
          fi

          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "❌ Frontend build failed"
            failed=1
          fi

          if [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "❌ Frontend tests failed"
            failed=1
          fi

          if [ "${{ needs.e2e-cypress.result }}" != "success" ]; then
            echo "❌ E2E Cypress tests failed"
            failed=1
          fi

          if [ $failed -eq 1 ]; then
            echo "❌ Some checks failed. Please review the errors above."
            exit 1
          fi

          echo "✅ All checks passed!"
