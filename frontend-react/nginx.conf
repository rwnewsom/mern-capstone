server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # SPA routing - fallback to index.html for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (Nginx's own, for the container's HEALTHCHECK —
    # not the backend's /health; see /metrics etc. below for that)
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy API requests to backend. Every path the backend actually serves
    # (see backend-rest/exercise_controller.mjs, auth_routes.mjs,
    # user_routes.mjs) needs to be listed here, mirroring vite.config.js's
    # dev proxy — otherwise a relative-path fetch() falls through to the
    # SPA's index.html instead of reaching the backend.
    location ~ ^/(exercises|auth|users|metrics|config) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trace export (src/utils/tracing.js) goes to Jaeger directly, not the
    # backend -- Jaeger's OTLP/HTTP receiver doesn't send
    # Access-Control-Allow-Origin, so the browser can't call it cross-origin
    # no matter what; proxying it same-origin sidesteps that entirely.
    location /v1/traces {
        proxy_pass http://jaeger:4318/v1/traces;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
