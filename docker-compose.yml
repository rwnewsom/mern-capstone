services:
  # MongoDB database
  mongodb:
    image: mongo:7
    container_name: exercise-tracker-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: exercise-tracker-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "6831:6831/udp"  # Jaeger collector (Thrift over UDP)
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    restart: unless-stopped

  # Express backend API
  backend:
    build:
      context: ./backend-rest
      dockerfile: Dockerfile
    container_name: exercise-tracker-api
    environment:
      MONGODB_CONNECT_STRING: mongodb://root:password@mongodb:27017/?authSource=admin
      PORT: 3000
      NODE_ENV: development
      JAEGER_HOST: jaeger
      JAEGER_PORT: 6831
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ./backend-rest:/app
      - /app/node_modules
    restart: unless-stopped

  # React frontend
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: exercise-tracker-ui
    environment:
      VITE_API_URL: http://localhost
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  default:
    name: exercise-tracker-network
