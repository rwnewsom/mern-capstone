services:
  # MongoDB database
  mongodb:
    image: mongo:7
    container_name: exercise-tracker-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: exercise-tracker-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP/HTTP receiver (used by the backend to send spans)
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    restart: unless-stopped

  # Prometheus metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: exercise-tracker-prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    restart: unless-stopped

  # Express backend API
  backend:
    build:
      context: ./backend-rest
      dockerfile: Dockerfile
    container_name: exercise-tracker-api
    environment:
      MONGODB_CONNECT_STRING: mongodb://root:password@mongodb:27017/?authSource=admin
      PORT: 3000
      NODE_ENV: development
      JAEGER_HOST: jaeger
      JAEGER_OTLP_PORT: 4318
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ./backend-rest:/app
      - /app/node_modules
    restart: unless-stopped

  # React frontend
  # No VITE_API_URL here: Vite inlines env vars at `npm run build` time (in
  # the Dockerfile), not container runtime, so a docker-compose `environment:`
  # entry for it would silently do nothing. The built app uses relative paths,
  # proxied to the backend by nginx.conf, so no build-time API URL is needed.
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: exercise-tracker-ui
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  prometheus_data:

networks:
  default:
    name: exercise-tracker-network
